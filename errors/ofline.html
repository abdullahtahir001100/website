<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Are Offline</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables for easy color management */
        :root {
            --silva-green: #009688;
            --bg-color: #f0f8f8; /* Light mint/teal background */
            --text-dark: #1f2937;
            --text-medium: #6b7280;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* 1. Global and Body Styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }

        /* 2. Main Card Container */
        .error-card {
            background-color: #ffffff;
            padding: 40px; /* Base padding */
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            text-align: center;
            max-width: 450px; /* Max width for desktop viewing */
            width: 100%;
            transition: box-shadow 0.3s ease-in-out;
        }
        
        .error-card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* Responsive adjustments for padding on smaller screens */
        @media (min-width: 600px) {
            .error-card {
                padding: 60px; /* Increased padding for larger screens */
            }
        }

        /* 3. Logo Styling */
        .logo {
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-icon {
            width: 24px;
            height: 24px;
            color: var(--silva-green);
            margin-right: 4px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* 4. Illustration Placeholder (mimics the graphic's space) */
        .illustration-placeholder {
            margin: 0 auto 40px auto;
            width: 100%;
            max-width: 300px; /* Matches the approximate width of the graphic */
            height: 160px; /* Matches the approximate height of the graphic */
            display: flex;
            align-items: center;
            justify-content: center;
            /* Placeholder styling to show the area */
            background-color: #f7f7f7;
            border: 1px dashed #cccccc;
            color: var(--text-medium);
            font-size: 14px;
            font-weight: 600;
        }

        /* 5. Typography */
        h1 {
            font-size: 30px;
            font-weight: 800;
            color: var(--text-dark);
            margin: 0 0 12px 0;
        }

        .description {
            color: var(--text-medium);
            margin: 0 0 40px 0;
            padding: 0 15px; /* Add some horizontal padding for narrow screens */
            font-size: 16px;
        }
        
        @media (max-width: 400px) {
            h1 {
                font-size: 24px; /* Adjust size for very small screens */
            }
            .description {
                font-size: 14px;
            }
        }


        /* 6. Button Styling */
        .btn-home {
            display: inline-block;
            padding: 12px 32px;
            background-color: var(--silva-green);
            color: white;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 150, 136, 0.3); /* Shadow based on the green color */
            transition: background-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }

        .btn-home:hover {
            background-color: #00796b; /* Darker green on hover */
            box-shadow: 0 6px 8px rgba(0, 150, 136, 0.5);
        }
        .img{
            width: 34px;
        }
        .width{
         width: 80%;
        }

    </style>
</head>
<body>

    <!-- Main Card Container -->
    <div class="error-card">
        
        <!-- Logo -->
        <div class="logo">
            <!-- Simple square icon placeholder using inline SVG for maximum portability -->
      <img src="https://inkbyhand.com/wp-content/uploads/2025/08/Main-Logo-2-e1756815161444.png" alt="" class="img">
            <span class="logo-text">InkByHand</span>
        </div>

        <!-- Illustration Placeholder -->
        <div >
           <img src="	https://zoyothemes.com/silva/html/assets/images/svg/offline.svg" alt="" class="width">
        </div>

        <!-- Main Heading -->
        <h1>
            You Are Offline
        </h1>

        <!-- Subtext / Description -->
        <p class="description">
            Internet connection is lost. Try checking the signal, and refresh the screen later.
        </p>

        <!-- Action Button -->
        <a href="#" class="btn-home">
            Back to Home
        </a>
    </div>

</body>
</html>
