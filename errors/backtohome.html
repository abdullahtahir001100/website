<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed! 🎉</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* CSS Variables */
        :root {
            --success-green: #28a745;
            --bg-color: #f0fdf4; /* Very light green background */
            --text-dark: #1f2937;
            --text-medium: #4b5563;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        /* 1. Global and Body Styles */
        body {
            font-family: 'Inter', sans-serif;
           
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
            color: var(--text-dark);
        }

        /* 2. Main Card Container */
        .confirmation-card {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }

        /* 3. Logo/Brand Name */
        .logo {
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* 4. Icon Container (Uses Font Awesome Icon) */
        .icon-wrapper {
            margin: 0 auto 30px auto;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px; /* Large Icon Size */
            color: var(--success-green);
        }
        
        /* Font Awesome Icon Styling */
        .fa-check-circle {
            animation: scaleBounce 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 5. Typography */
        h1 {
            font-size: 30px;
            font-weight: 800;
            color: var(--text-dark);
            margin: 0 0 10px 0;
        }

        .description {
            color: var(--text-medium);
            margin: 0 0 40px 0;
            font-size: 16px;
            line-height: 1.6;
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 24px;
            }
            .confirmation-card {
                padding: 40px 20px;
            }
        }

        /* 6. Button Styling */
        .btn-action {
            display: inline-block;
            padding: 14px 30px;
            background-color: var(--success-green);
            color: white;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.2);
            transition: background-color 0.2s, transform 0.2s;
        }

        .btn-action:hover {
            background-color: #1e7e34;
            transform: translateY(-2px);
        }
        
        /* 7. Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleBounce {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            80% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="confirmation-card">
        
        <div class="logo">
            <i class="fas fa-feather-alt" style="color: #f7c5c1; font-size: 24px;"></i>
            <span class="logo-text">InkByHand</span>
        </div>

        <div class="icon-wrapper">
            <i class="fas fa-check-circle"></i>
        </div>

        <h1>
            Thank You for Your Order!
        </h1>

        <p class="description">
            Your order has been successfully placed. We'll send a confirmation email and WhatsApp message with tracking details soon.
        </p>

        <a href="../product.html" class="btn-action">
            Continue Shopping
        </a>
    </div>

</body>
</html>
