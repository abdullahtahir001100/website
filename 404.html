    <style>
        :root {
            --bg: #050505;
            --text: #fff;
            --accent: #d6b598;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- SVG Background Animation --- */
        .bg-svg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            opacity: 0.2;
            pointer-events: none;
            z-index: 1;
        }
        
        .line-path {
            fill: none;
            stroke: #fff;
            stroke-width: 0.5;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawPath 4s ease-in-out forwards infinite alternate;
        }

        @keyframes drawPath {
            0% { stroke-dashoffset: 1000; opacity: 0; }
            40% { opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }

        /* --- Glitch Text --- */
        .glitch-wrapper {
            position: relative;
            z-index: 10;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 15vw;
            line-height: 0.8;
            mix-blend-mode: exclusion;
        }

        .glitch {
            position: relative;
            color: #fff;
        }

        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg);
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 red;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 blue;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 81px, 0); }
            20% { clip: rect(65px, 9999px, 19px, 0); }
            40% { clip: rect(24px, 9999px, 91px, 0); }
            60% { clip: rect(4px, 9999px, 86px, 0); }
            80% { clip: rect(54px, 9999px, 26px, 0); }
            100% { clip: rect(93px, 9999px, 13px, 0); }
        }

        .sub-text {
            margin-top: 30px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 1rem;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s 0.5s forwards;
            text-align: center;
        }

        .home-btn {
            margin-top: 40px;
            padding: 15px 40px;
            border: 1px solid rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            z-index: 10;
            opacity: 0;
            animation: fadeUp 1s 0.8s forwards;
        }
        .home-btn:hover { background: #fff; color: #000; }
        
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Cursor --- */
        .cursor { width: 10px; height: 10px; background: #fff; border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; mix-blend-mode: difference; }
        .cursor-f { width: 40px; height: 40px; border: 1px solid rgba(255,255,255,0.5); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9998; transition: transform 0.1s; }

    </style>

<body>

    <div class="cursor"></div>
    <div class="cursor-f"></div>

    <!-- Animated Abstract SVG Background -->
    <svg class="bg-svg" viewBox="0 0 500 500">
        <path class="line-path" d="M10,250 Q125,10 250,250 T490,250" />
        <path class="line-path" d="M10,150 Q125,400 250,150 T490,150" style="animation-delay: 0.5s;" />
        <path class="line-path" d="M10,350 Q125,100 250,350 T490,350" style="animation-delay: 1s;" />
        <circle cx="250" cy="250" r="100" class="line-path" style="animation-duration: 6s;" />
    </svg>

    <div class="glitch-wrapper">
        <div class="glitch" data-text="404">404</div>
    </div>

    <div class="sub-text">
        The page you seek has been<br>lost to the void.
    </div>

    <a href="index.html" class="home-btn">Return to Light</a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        // Cursor Logic
        const cursor = document.querySelector('.cursor');
        const follower = document.querySelector('.cursor-f');
        
        window.addEventListener('mousemove', (e) => {
            gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.1 });
            gsap.to(follower, { x: e.clientX - 15, y: e.clientY - 15, duration: 0.3 });
        });

        // Hover Effect
        document.querySelector('.home-btn').addEventListener('mouseenter', () => {
            gsap.to(follower, { scale: 2, background: 'rgba(255,255,255,0.1)', border: 'none' });
        });
        document.querySelector('.home-btn').addEventListener('mouseleave', () => {
            gsap.to(follower, { scale: 1, background: 'transparent', border: '1px solid rgba(255,255,255,0.5)' });
        });

    </script>
</body>
