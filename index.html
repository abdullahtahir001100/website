<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INKBYHAND | Art Gallery</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --bg-light: #fdfcf8;
            --text-dark: #1a1a1a;
            --accent: #c5a059;
            --header-bg: rgba(253, 252, 248, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Playfair Display', serif; }
        body { background: var(--bg-light); color: var(--text-dark); overflow: hidden; }

        /* Navigation */
        .main-header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: var(--header-bg); backdrop-filter: blur(10px);
            padding: 20px 5%; display: flex; justify-content: space-between; align-items: center;
        }
        .header-logo img { width: 140px; }

        /* Hero */
        .hero { height: 100vh; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        #hero-canvas { position: absolute; width: 100%; height: 100%; opacity: 0.5; }
        .hero-content { position: relative; z-index: 2; text-align: center; color: white; }
        .hero h1 { font-size: 8vw; letter-spacing: 10px; text-transform: uppercase; }

        /* Dynamic Product Grid */
        .shop-section { padding: 100px 5%; background: var(--bg-light); }
        .section-header { margin-bottom: 60px; text-align: center; }
        .section-header h2 { font-size: 3rem; margin-bottom: 10px; }
        
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
            gap: 40px; 
        }

        .art-card {
            background: white; border-radius: 15px; overflow: hidden;
            transition: transform 0.4s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            cursor: pointer; position: relative;
        }
        .art-card:hover { transform: translateY(-10px); }
        .art-card img { width: 100%; height: 450px; object-fit: cover; }
        
        .art-info { padding: 25px; }
        .art-info h3 { font-size: 1.5rem; margin-bottom: 5px; }
        .art-info p { color: #777; font-size: 0.9rem; margin-bottom: 15px; text-transform: uppercase; }
        .art-price { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        
        /* Swiper Overrides */
        .swiper-slide { width: 400px; height: 550px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }

        footer { background: #111; color: white; padding: 100px 5% 50px; }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-logo"><img src="https://inkbyhand.com/wp-content/uploads/2025/08/Main-Logo-2-e1756815161444.png" alt="Logo"></div>
        <div class="nav-icons"><i class="fas fa-shopping-bag"></i></div>
    </header>

    <div id="main-container" data-scroll-container>
        
        <section class="hero" data-scroll-section>
            <canvas id="hero-canvas"></canvas>
            <div class="hero-content" data-scroll data-scroll-speed="2">
                <h1>Curated Gallery</h1>
                <p>Spiritual Art by Areeba Tahir</p>
            </div>
        </section>

        <section class="featured-slider" style="padding: 100px 0; background: #0a0a0a;" data-scroll-section>
            <h2 style="color:white; text-align: center; margin-bottom: 50px; font-size: 2.5rem;">Signature Pieces</h2>
            <div class="swiper mySwiper">
                <div class="swiper-wrapper" id="swiper-target">
                    </div>
            </div>
        </section>

        <section class="shop-section" data-scroll-section>
            <div class="section-header gsap-fade-up">
                <h2>The Collection</h2>
                <p>Hand-painted calligraphy on premium canvas</p>
            </div>
            <div class="product-grid" id="grid-target">
                </div>
        </section>

        <footer data-scroll-section>
            <p style="text-align: center; opacity: 0.5;">© 2026 INKBYHAND ART GALLERY</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        // YOUR DATA
        const artData = [
            {
                "title": "99 Names Of Allah",
                "artist": "Areeba Tahir",
                "price": 2500,
                "mainImage": "https://res.cloudinary.com/dwnnadeb0/image/upload/v1764773613/art_gallery_products/lbhqkkgckqw5wpw6tl7q.jpg",
                "category": "Painting"
            },
            {
                "title": "Surah Kausar",
                "artist": "Areeba Tahir",
                "price": 1600,
                "mainImage": "https://res.cloudinary.com/dwnnadeb0/image/upload/v1764773301/art_gallery_products/iwbv0bparcfvmrzcf45b.jpg",
                "category": "Modern"
            },
            {
                "title": "Darood e Ibrhimi",
                "artist": "Areeba Tahir",
                "price": 2600,
                "mainImage": "https://res.cloudinary.com/dwnnadeb0/image/upload/v1764774635/art_gallery_products/ahwk8mdx6alh5eolg44i.jpg",
                "category": "Classic"
            },
            {
                "title": "Surah Rehman",
                "artist": "Areeba Tahir",
                "price": 1200,
                "mainImage": "https://res.cloudinary.com/dwnnadeb0/image/upload/v1764772989/art_gallery_products/wotk4oicdd79flhxglji.jpg",
                "category": "Painting"
            },
            {
                "title": "Kaswa Paintaing",
                "artist": "Areeba Tahir",
                "price": 3000,
                "mainImage": "https://res.cloudinary.com/dwnnadeb0/image/upload/v1764774940/art_gallery_products/v3psc0d6dfqwrlrkwy1s.jpg",
                "category": "Large Scale"
            }
            // ... Add more from your JSON as needed
        ];

        // 1. Injected Data Logic
        const gridTarget = document.getElementById('grid-target');
        const swiperTarget = document.getElementById('swiper-target');

        artData.forEach(item => {
            // Fill Grid
            gridTarget.innerHTML += `
                <div class="art-card gsap-fade-up">
                    <img src="${item.mainImage}" alt="${item.title}">
                    <div class="art-info">
                        <p>${item.category} • ${item.artist}</p>
                        <h3>${item.title}</h3>
                        <div class="art-price">$${item.price}</div>
                    </div>
                </div>
            `;
            // Fill Swiper
            swiperTarget.innerHTML += `
                <div class="swiper-slide">
                    <img src="${item.mainImage}" alt="${item.title}">
                </div>
            `;
        });

        // 2. Initialize Locomotive & ScrollTrigger
        const scroller = new LocomotiveScroll({
            el: document.querySelector('[data-scroll-container]'),
            smooth: true
        });

        scroller.on("scroll", ScrollTrigger.update);
        ScrollTrigger.scrollerProxy("[data-scroll-container]", {
            scrollTop(value) { return arguments.length ? scroller.scrollTo(value, 0, 0) : scroller.scroll.instance.scroll.y; },
            getBoundingClientRect() { return {top: 0, left: 0, width: window.innerWidth, height: window.innerHeight}; }
        });

        // 3. Animations
        gsap.utils.toArray('.gsap-fade-up').forEach(elem => {
            gsap.from(elem, {
                scrollTrigger: { trigger: elem, scroller: "[data-scroll-container]", start: "top 90%" },
                y: 60, opacity: 0, duration: 1.2, ease: "power3.out"
            });
        });

        // 4. Swiper Init
        new Swiper(".mySwiper", {
            effect: "coverflow",
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: "auto",
            coverflowEffect: { rotate: 5, stretch: 0, depth: 100, modifier: 2, slideShadows: true },
            loop: true,
            autoplay: { delay: 3000 }
        });

        ScrollTrigger.addEventListener("refresh", () => scroller.update());
        ScrollTrigger.refresh();
    </script>
</body>
</html>
