    <script>
        // --- Configuration ---
        const API_BASE_URL = 'https://backend-web-1.vercel.app/api'; 
        // Note: Change to 'https://backend-web-1-yb6q.vercel.app/api' if the previous domain was preferred.
        
        let allProducts = [];
        let galleryImagesBase64 = []; // Store multiple images

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchProducts();
            
            // Header Toggle Logic
            const openBtn = document.getElementById('open-menu');
            const closeBtn = document.getElementById('close-menu');
            const mobileMenu = document.getElementById('mobile-menu');

            if(openBtn) openBtn.addEventListener('click', () => mobileMenu.classList.add('active'));
            if(closeBtn) closeBtn.addEventListener('click', () => mobileMenu.classList.remove('active'));

            // Search Logic
            document.getElementById('search-input').addEventListener('input', filterProducts);

            // Form Submit
            document.getElementById('product-form').addEventListener('submit', handleFormSubmit);
        });

        // --- Core Functions ---

        async function fetchProducts() {
            try {
                const res = await fetch(`${API_BASE_URL}/products`);
                if (!res.ok) throw new Error('Failed to fetch data');
                allProducts = await res.json();
                renderProducts(allProducts);
                document.getElementById('total-count').textContent = `Total Items: ${allProducts.length}`;
            } catch (error) {
                console.error(error);
                document.getElementById('product-grid').innerHTML = `
                    <div class="col-span-full text-center text-red-500 font-mono text-sm border border-red-900 p-4 bg-red-900/10">
                        Error connecting to server. <br> ${error.message}
                    </div>
                `;
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            if (products.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-muted font-mono py-12">NO_DATA_FOUND</div>';
                return;
            }

            grid.innerHTML = products.map(product => `
                <div class="glass-card p-4 gsap-card group relative">
                    <div class="product-img-box mb-6">
                        <img src="${product.mainImage || 'https://via.placeholder.com/400x400?text=No+Image'}" 
                             alt="${product.title}" 
                             loading="lazy"
                             onerror="this.src='https://via.placeholder.com/400x400?text=Error'">
                        <div class="absolute top-0 right-0 p-2 flex gap-1">
                            <span class="bg-black/50 backdrop-blur text-white text-[9px] font-black px-2 py-1 uppercase border border-white/10 hover:bg-accent cursor-pointer transition-colors" 
                                  onclick="editProduct('${product._id}')">Edit</span>
                            <span class="bg-red-900/50 backdrop-blur text-white text-[9px] font-black px-2 py-1 uppercase border border-red-500/30 hover:bg-red-600 cursor-pointer transition-colors" 
                                  onclick="deleteProduct('${product._id}')">✕</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-display text-lg font-bold uppercase tracking-tight truncate pr-2">${product.title}</h3>
                        <span class="text-accent font-mono text-sm font-bold">$${product.price}</span>
                    </div>
                    <p class="text-[10px] text-muted font-bold uppercase tracking-widest mb-4 font-mono truncate">${product.artist || 'Unknown Artist'}</p>
                    
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="text-[9px] bg-white/5 px-2 py-1 rounded border border-white/5">${product.category || 'Art'}</span>
                        <span class="text-[9px] bg-white/5 px-2 py-1 rounded border border-white/5">${product.dimensions || 'N/A'}</span>
                    </div>

                    <div class="flex items-center justify-between pt-4 border-t border-white/5">
                        <div class="flex flex-col">
                            <span class="text-[9px] text-muted uppercase font-bold">Status</span>
                            <span class="text-green-500 text-xs font-black uppercase">Active</span>
                        </div>
                        <button class="w-8 h-8 border border-white/10 flex items-center justify-center group-hover:bg-white group-hover:text-black transition-colors" onclick="Swal.fire({ title: 'View Details', text: 'Not fully implemented in this demo', icon: 'info', background: '#111', color: '#fff', confirmButtonColor: '#ff3c00' })">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                        </button>
                    </div>
                </div>
            `).join('');

            // Re-trigger animations
            gsap.from('.gsap-card', {
                scale: 0.95,
                opacity: 0,
                duration: 0.5,
                stagger: 0.05,
                ease: 'power2.out'
            });
        }

        function filterProducts() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const filtered = allProducts.filter(p => 
                (p.title && p.title.toLowerCase().includes(term)) || 
                (p.artist && p.artist.toLowerCase().includes(term)) ||
                (p.category && p.category.toLowerCase().includes(term))
            );
            renderProducts(filtered);
        }

        // --- Modal & Form Logic ---

        function openModal(mode, data = null) {
            const modal = document.getElementById('product-modal');
            const form = document.getElementById('product-form');
            const title = document.getElementById('modal-title');
            const saveBtn = document.getElementById('save-btn');
            
            // Activate Modal
            modal.classList.add('active');
            gsap.from(".modal-content", { y: 50, opacity: 0, duration: 0.5, ease: "power4.out" });

            // Reset form
            form.reset();
            document.getElementById('product-id').value = '';
            document.getElementById('main-preview').innerHTML = '<span class="text-[10px] text-muted font-mono">WAITING_FOR_UPLOAD...</span>';
            document.getElementById('gallery-preview').innerHTML = '';
            document.getElementById('mainImageBase64').value = ''; // Reset hidden input
            galleryImagesBase64 = [];

            if (mode === 'edit' && data) {
                title.textContent = 'EDIT_ENTRY';
                saveBtn.textContent = 'UPDATE_DATABASE';
                
                // Fill fields
                document.getElementById('product-id').value = data._id;
                document.getElementById('title').value = data.title || '';
                document.getElementById('artist').value = data.artist || '';
                document.getElementById('price').value = data.price || '';
                document.getElementById('priceRange').value = data.priceRange || '';
                document.getElementById('dimensions').value = data.dimensions || '';
                document.getElementById('size').value = data.size || 'Medium';
                document.getElementById('category').value = data.category || '';
                document.getElementById('medium').value = data.medium || '';
                document.getElementById('style').value = data.style || '';
                document.getElementById('subject').value = data.subject || '';
                document.getElementById('orientation').value = data.orientation || 'Square';
                document.getElementById('country').value = data.country || '';
                document.getElementById('palette').value = data.palette || '';
                document.getElementById('description').value = data.description || '';
                document.getElementById('artistBio').value = data.artistBio || '';

                // Handle Image Previews (Use URLs from backend)
                if (data.mainImage) {
                    console.log('Rendering Main Image:', data.mainImage);
                    document.getElementById('main-preview').innerHTML = `<img src="${data.mainImage}" class="w-full h-full object-cover">`;
                    // Important: Store existing URL in the hidden field so we don't send empty if not changed
                    document.getElementById('mainImageBase64').value = data.mainImage;
                }

                if (data.smallImages && Array.isArray(data.smallImages) && data.smallImages.length > 0) {
                    console.log('Rendering Gallery Images:', data.smallImages);
                    galleryImagesBase64 = data.smallImages; // Keep existing URLs
                    
                    const galleryContainer = document.getElementById('gallery-preview');
                    data.smallImages.forEach(url => {
                        const div = document.createElement('div');
                        div.className = 'flex-shrink-0 w-20 h-20 border border-white/10 overflow-hidden relative group';
                        div.innerHTML = `
                            <img src="${url}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/50 hidden group-hover:flex items-center justify-center text-[10px] text-white">STORED</div>
                        `;
                        galleryContainer.appendChild(div);
                    });
                }

            } else {
                title.textContent = 'NEW_PRODUCT';
                saveBtn.textContent = 'PUSH_TO_DATABASE';
            }
        }

        function closeModal() {
            document.getElementById('product-modal').classList.remove('active');
        }

        async function editProduct(id) {
            try {
                // Priority 1: Check local loaded data (Instant)
                let product = allProducts.find(p => p._id === id);

                // Priority 2: If missing (e.g. pagination/deleted), fetch from server
                if (!product) {
                    const res = await fetch(`${API_BASE_URL}/products/${id}`);
                    if (!res.ok) throw new Error('Product not found on server');
                    product = await res.json();
                }

                // If fetched successfully, open modal
                if (product) openModal('edit', product);

            } catch (error) {
                console.error("Error loading product:", error);
                
                // Fallback: Try fetching fresh data even if local check failed incorrectly
                try {
                     const res = await fetch(`${API_BASE_URL}/products/${id}`);
                     if(res.ok) {
                         const product = await res.json();
                         openModal('edit', product);
                         return;
                     }
                } catch(e) { console.error(e); }

                Swal.fire({
                    icon: 'error',
                    title: 'Load Error',
                    text: 'Could not load product details. Possible network or ID issue.',
                    background: '#111',
                    color: '#fff',
                    confirmButtonColor: '#ff3c00'
                });
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('save-btn');
            const originalText = saveBtn.textContent;
            saveBtn.textContent = 'Processing...';
            saveBtn.disabled = true;

            const id = document.getElementById('product-id').value;
            const isEdit = !!id;

            // Gather Data
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            // Add Images
            // Note: The backend expects 'mainImage' to be a Base64 string OR a URL string
            data.mainImage = document.getElementById('mainImageBase64').value;
            // The backend expects 'smallImages' to be an array of strings
            data.smallImages = galleryImagesBase64;

            // Clean up file inputs from the object (we handled them manually)
            delete data['mainImageInput']; // name attribute from HTML input
            delete data['smallImagesInput'];

            try {
                const url = isEdit ? `${API_BASE_URL}/products/${id}` : `${API_BASE_URL}/products`;
                const method = isEdit ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!res.ok) throw new Error('Operation Failed');

                const result = await res.json();
                
                Swal.fire({
                    icon: 'success',
                    title: isEdit ? 'Updated!' : 'Created!',
                    text: `Product ${result.title} has been saved.`,
                    background: '#111',
                    color: '#fff',
                    confirmButtonColor: '#ff3c00'
                });

                closeModal();
                fetchProducts(); // Refresh Grid

            } catch (error) {
                console.error(error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Something went wrong. Check console.',
                    background: '#111',
                    color: '#fff'
                });
            } finally {
                saveBtn.textContent = originalText;
                saveBtn.disabled = false;
            }
        }

        async function deleteProduct(id) {
            const result = await Swal.fire({
                title: 'Are you sure?',
                text: "You won't be able to revert this!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc2626',
                cancelButtonColor: '#333',
                confirmButtonText: 'Yes, delete!',
                background: '#111',
                color: '#fff'
            });

            if (result.isConfirmed) {
                try {
                    const res = await fetch(`${API_BASE_URL}/products/${id}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error('Delete failed');
                    
                    Swal.fire({ title:'Deleted!', text:'Product has been removed.', icon:'success', background:'#111', color:'#fff', confirmButtonColor:'#ff3c00'});
                    fetchProducts();
                } catch (error) {
                    Swal.fire({ title:'Error!', text:'Could not delete product.', icon:'error', background:'#111', color:'#fff'});
                }
            }
        }

        // --- Image Helpers ---

        function previewImage(input, previewId) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    document.getElementById(previewId).innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                    document.getElementById('mainImageBase64').value = e.target.result; // Store Base64
                }
                
                reader.readAsDataURL(file);
            }
        }

        function previewGallery(input) {
            const previewContainer = document.getElementById('gallery-preview');
            previewContainer.innerHTML = '';
            galleryImagesBase64 = []; // Reset current list

            if (input.files) {
                Array.from(input.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const div = document.createElement('div');
                        div.className = 'flex-shrink-0 w-20 h-20 border border-white/10 overflow-hidden relative';
                        div.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                        previewContainer.appendChild(div);
                        galleryImagesBase64.push(e.target.result); // Add Base64 to array
                    }
                    reader.readAsDataURL(file);
                });
            }
        }

        // --- Layout JS (Cursor, Smooth Scroll) ---
        const lenis = new Lenis();
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        const dot = document.querySelector('.cursor-dot');
        const circle = document.querySelector('.cursor-circle');
        window.addEventListener('mousemove', (e) => {
            gsap.to(dot, { x: e.clientX, y: e.clientY, duration: 0 });
            gsap.to(circle, { x: e.clientX - 17, y: e.clientY - 17, duration: 0.2 });
        });

        document.querySelectorAll('.btn-sharp').forEach(btn => {
            btn.addEventListener('mouseenter', () => gsap.to(circle, { scale: 1.5, borderColor: '#ff3c00', duration: 0.3 }));
            btn.addEventListener('mouseleave', () => gsap.to(circle, { scale: 1, borderColor: 'rgba(255,255,255,0.3)', duration: 0.3 }));
        });

    </script>
</body>
</html>
