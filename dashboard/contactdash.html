    <style>
        /* Aesthetic: Sharp edges, no radius, no shadows */
        * {
            border-radius: 0 !important;
            overflow-x: hidden;
            box-shadow: none !important;
        }

        body { 
            background-color: #050505; 
            color: #ffffff; 
            cursor: default; 
            overflow: hidden;
            font-family: 'Space Grotesk', sans-serif;
        }

        @media (min-width: 768px) {
            body { cursor: none; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #ff3c00; }

        /* Cursor */
        .cursor-dot { position: fixed; top: 0; left: 0; width: 6px; height: 6px; background: white; pointer-events: none; z-index: 9999; mix-blend-mode: difference; display: none; }
        .cursor-circle { position: fixed; top: 0; left: 0; width: 30px; height: 30px; border: 1px solid rgba(255,255,255,0.3); pointer-events: none; z-index: 9998; transition: width 0.3s, height 0.3s; display: none; }
        
        @media (min-width: 768px) {
            .cursor-dot, .cursor-circle { display: block; }
        }

        body.hovering .cursor-circle { width: 45px; height: 45px; border-color: #ff3c00; background: rgba(255,60,0,0.05); }

        /* Responsive Layout */
        .chat-container {
            height: calc(100vh - 80px);
            display: grid;
            grid-template-columns: 1fr; /* Mobile: Single column */
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        @media (min-width: 768px) {
            .chat-container {
                grid-template-columns: 350px 1fr; /* Desktop: Dual column */
            }
        }

        .sidebar {
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            background: #0a0a0a;
            z-index: 20;
        }

        .chat-window {
            background: #050505;
            display: flex;
            flex-direction: column;
            position: absolute;
            inset: 0;
            z-index: 10;
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }

        @media (min-width: 768px) {
            .chat-window {
                position: static;
                transform: translateX(0);
            }
        }

        .chat-window.active-mobile {
            transform: translateX(0);
            z-index: 30;
        }

        /* Message Bubbles */
        .msg-bubble {
            max-width: 85%;
            padding: 1rem;
            margin-bottom: 1rem;
            position: relative;
            font-size: 0.875rem;
            line-height: 1.5;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (min-width: 768px) {
            .msg-bubble { max-width: 70%; }
        }

        .msg-received {
            align-self: flex-start;
            background: #111;
            color: #fff;
        }

        .msg-sent {
            align-self: flex-end;
            background: #ff3c00;
            color: #fff;
            border: none;
        }

        .chat-input-area {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: #0a0a0a;
            padding: 1rem;
        }

        @media (min-width: 768px) {
            .chat-input-area { padding: 1.5rem; }
        }

        input::placeholder {
            color: #444;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.7rem;
        }

        .convo-item.active {
            background: #111;
            border-left: 3px solid #ff3c00;
        }

        /* Navigation Styles from Overview */
        .nav-link { position: relative; opacity: 0.6; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { opacity: 1; color: #ff3c00; }

        /* Mobile Menu */
        #mobile-menu {
            transform: translateY(-100%);
            transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1);
        }
        #mobile-menu.active { transform: translateY(0); }

        /* header fix for chat layout */
        main.chat-container {
            margin-top: 80px; /* Header height */
            height: calc(100vh - 80px);
        }
        
    </style>
    
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

<body class="antialiased">

    <div class="cursor-dot"></div>

    <header class="fixed w-full top-0 z-50 bg-black/80 backdrop-blur-md border-b border-white/5 h-20">
        <div class="max-w-[1600px] mx-auto px-4 md:px-8 flex items-center justify-between h-full">
            <div class="flex items-center gap-8">
                <div class="font-display text-xl md:text-2xl font-black tracking-tighter">

                    <a href="dashboard.html" class="nav-link text-sm font-bold uppercase tracking-widest">Inventory</a>

    <main class="chat-container">
        <aside class="sidebar flex flex-col w-full h-full">

        <section class="chat-window" id="chatWindow">

                <div class="flex items-center gap-4">
                    <button id="closeChat" class="md:hidden text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <div>
                        <h2 class="font-display text-sm md:text-lg font-bold tracking-tight uppercase" id="activeName">Select a conversation</h2>
                        <p class="text-[9px] md:text-[10px] text-muted font-mono tracking-widest" id="activeStatus">IDLE_STATE</p>
                    </div>
                </div>
                <button class="text-muted hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg></button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col" id="messageDisplay">
                <div class="m-auto text-center opacity-20">
                    <div class="font-display text-3xl md:text-4xl font-bold italic">INKBYHAND</div>
                    <p class="text-[9px] font-mono mt-2 uppercase tracking-[0.3em]">Encrypted Connection Established</p>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="flex gap-2 md:gap-4 items-center">
                    <button class="hidden sm:block text-muted hover:text-accent transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4"></path></svg>
                    </button>
                    <input type="text" id="chatInput" placeholder="TYPE MESSAGE..." class="flex-1 bg-transparent border-none focus:ring-0 text-xs md:text-sm py-2">
                    <button id="sendBtn" class="bg-white text-black px-4 md:px-6 py-2 text-[10px] md:text-[11px] font-bold tracking-widest hover:bg-accent hover:text-white transition-all">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const API_URL = 'https://backend-web-1.vercel.app/api/contact';
        let allMessages = [];

        // Desktop Cursor
        const dot = document.querySelector('.cursor-dot');
        const circle = document.querySelector('.cursor-circle');
        window.addEventListener('mousemove', (e) => {
            gsap.to(dot, { x: e.clientX, y: e.clientY, duration: 0 });
            gsap.to(circle, { x: e.clientX, y: e.clientY, duration: 0.15 });
        });

        async function init() {
            try {
                const res = await fetch(API_URL);
                if(!res.ok) throw new Error("Failed to fetch");
                const result = await res.json();
                
                // Inspect API structure: if {data: [...]}, use that.
                allMessages = result.data || result; 
                
                renderList();

                // Search Listener
                document.getElementById('search-contacts').addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    const filtered = allMessages.filter(msg => 
                        (msg.firstName && msg.firstName.toLowerCase().includes(term)) ||
                        (msg.lastName && msg.lastName.toLowerCase().includes(term)) || 
                        (msg.email && msg.email.toLowerCase().includes(term)) ||
                        (msg.contactDetails && msg.contactDetails.toLowerCase().includes(term)) ||
                        (msg.message && msg.message.toLowerCase().includes(term))
                    );
                    renderList(filtered);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('conversationList').innerHTML = 
                    '<div class="p-6 text-xs text-red-500 font-mono text-center border border-red-900/30 m-4 bg-red-900/5">CONNECTION_LOST<br>RETRYING_LINK...</div>';
            }
        }

        function renderList(items = allMessages) {
            const list = document.getElementById('conversationList');
            list.innerHTML = ''; 

            if(!Array.isArray(items) || items.length === 0) {
                list.innerHTML = '<div class="p-6 text-xs text-muted font-mono text-center">NO_MATCHES_FOUND</div>';
                return;
            }

            items.forEach(msg => {
                const item = document.createElement('div');
                item.className = 'convo-item p-4 md:p-6 border-b border-white/5 cursor-pointer hover:bg-white/5 transition-all';
                
                // Format Date Safe
                let timeStr = "UNKNOWN";
                if(msg.createdAt) {
                    const date = new Date(msg.createdAt);
                    timeStr = date.toLocaleDateString(undefined, {month:'short', day:'numeric'}) + ' ' + 
                              date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                }

                item.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-[10px] md:text-[11px] font-bold tracking-tight uppercase">${msg.firstName} ${msg.lastName}</span>
                        <span class="text-[8px] md:text-[9px] font-mono text-muted">${timeStr}</span>
                    </div>
                    <p class="text-xs text-muted truncate">${msg.message}</p>
                    ${!msg.isRead ? '<span class="inline-block w-1.5 h-1.5 bg-accent rounded-full mt-2"></span>' : ''}
                `;
                item.onclick = (e) => loadChat(msg, e);
                list.appendChild(item);
            });
        }

        function loadChat(msg, e) {
            document.getElementById('activeName').innerText = `${msg.firstName} ${msg.lastName}`;
            document.getElementById('activeStatus').innerText = "CONTACT_FORM_ENTRY";
            
            // Mobile toggle
            document.getElementById('chatWindow').classList.add('active-mobile');

            document.querySelectorAll('.convo-item').forEach(i => i.classList.remove('active'));
            if(e) e.currentTarget.classList.add('active');

            const display = document.getElementById('messageDisplay');
            display.innerHTML = '';
            
            // 1. Create Info Bubble (Contact Details)
            const infoDiv = document.createElement('div');
            infoDiv.className = 'msg-bubble msg-received border-l-2 border-accent bg-white/5';
            infoDiv.innerHTML = `
                <div class="flex flex-col gap-1">
                    <span class="text-[9px] text-muted uppercase tracking-widest font-bold">Sender_Details</span>
                    <strong class="text-white text-sm">${msg.email}</strong>
                    <span class="text-xs font-mono text-accent">${msg.contactDetails || 'No Phone Provided'}</span>
                </div>
            `;
            display.appendChild(infoDiv);

            // 2. Create Message Bubble (The actual inquiry)
            const textDiv = document.createElement('div');
            textDiv.className = 'msg-bubble msg-received mt-4';
            textDiv.innerText = msg.message;
            display.appendChild(textDiv);
            
            // Animate
            gsap.from([infoDiv, textDiv], { opacity: 0, y: 10, duration: 0.3, stagger: 0.1 });
            
            display.scrollTop = display.scrollHeight;
        
            
            const msgs = history[thread.id] || [{ side: 'received', text: "LOG_EMPTY: No prior records." }];
            
            msgs.forEach((m, i) => {
                const b = document.createElement('div');
                b.className = `msg-bubble ${m.side === 'sent' ? 'msg-sent' : 'msg-received'}`;
                b.innerText = m.text;
                display.appendChild(b);
                gsap.from(b, { opacity: 0, y: 10, duration: 0.3, delay: i * 0.05 });
            });
            
            display.scrollTop = display.scrollHeight;
        }

        // Close Chat for Mobile
        document.getElementById('closeChat').onclick = () => {
            document.getElementById('chatWindow').classList.remove('active-mobile');
        };

        function sendMessage() {
            const input = document.getElementById('chatInput');
            if(!input.value.trim()) return;

            const b = document.createElement('div');
            b.className = `msg-bubble msg-sent`;
            b.innerText = input.value;
            document.getElementById('messageDisplay').appendChild(b);
            
            input.value = '';
            const display = document.getElementById('messageDisplay');
            display.scrollTop = display.scrollHeight;
            gsap.from(b, { opacity: 0, x: 20, duration: 0.3 });
        }

        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('chatInput').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

        // Mobile Menu Toggles
        const openBtn = document.getElementById('open-menu');
        const closeBtn = document.getElementById('close-menu');
        const mobileMenu = document.getElementById('mobile-menu');

        if(openBtn) openBtn.addEventListener('click', () => mobileMenu.classList.add('active'));
        if(closeBtn) closeBtn.addEventListener('click', () => mobileMenu.classList.remove('active'));

        window.onload = init;
    </script>
</body>
