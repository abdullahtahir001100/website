<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management Dashboard</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary': {
                            500: '#4F46E5',
                            600: '#4338CA',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Optional custom styles for better readability and structure */
        body {
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }
        .card {
            background-color: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-radius: 0.75rem; /* rounded-xl */
            padding: 1.25rem; /* p-5 */
        }
        .detail-item {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #f3f4f6;
        }
        .detail-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body class="p-4 sm:p-6 lg:p-10">

    <div class="max-w-7xl mx-auto" id="app-container">

        <!-- ------------------- 1. ORDER LIST VIEW (Default) ------------------- -->
        <div id="order-list-view" class="space-y-6">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-6">Recent Orders</h1>
            
            <div class="card p-0 overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Order ID</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Customer</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total Amount</th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider"></th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- Order rows will be injected here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
        <!-- ---------------------------------------------------------------------- -->


        <!-- ------------------- 2. ORDER DETAIL VIEW (Hidden by default) ------------------- -->
        <div id="order-detail-view" class="hidden">
            
            <!-- Detail Header with Back Button -->
            <header class="mb-8">
                <button onclick="toggleView('list')" class="flex items-center text-primary-500 hover:text-primary-600 font-medium text-sm p-2 rounded-lg bg-white shadow hover:shadow-md transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    Back to Orders
                </button>
                
                <div class="flex flex-col sm:flex-row sm:items-center justify-between mt-6">
                    <h1 class="text-3xl font-extrabold text-gray-900 mb-2 flex items-center">
                        Order Details
                        <span id="detail-order-status" class="ml-4 text-sm font-semibold px-3 py-1 rounded-full text-white"></span>
                    </h1>
                    <p class="text-gray-500">Order ID: <span id="detail-order-id" class="font-medium text-gray-700"></span> | Date: <span id="detail-order-date"></span></p>
                </div>
            </header>


            <!-- Main Content Grid (Detail View) -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                <!-- Products and Summary (Column 1 & 2) -->
                <div class="lg:col-span-2 space-y-6">
                    
                    <!-- 1. Product Details Card -->
                    <div id="product-details-card" class="card">
                        <h2 class="flex items-center text-xl font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-primary-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                <path strokeLinecap="round" strokeLinejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                            </svg>
                            Product Details
                        </h2>
                        <div id="product-list" class="space-y-4">
                            <!-- Products will be injected here -->
                        </div>
                    </div>
                    
                    <!-- 3. Financial Summary Card -->
                    <div class="card">
                        <h2 class="flex items-center text-xl font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-primary-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                <path strokeLinecap="round" strokeLinejoin="round" d="M12 8c1.657 0 3 .895 3 2s-1.343 2-3 2l-2 3m0-3h-2m2 3h-2" />
                                <path strokeLinecap="round" strokeLinejoin="round" d="M12 6V4m0 4v2m-6 3h12a2 2 0 002-2V5a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h6" />
                            </svg>
                            Payment & Summary
                        </h2>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center text-gray-600">
                                <span>Subtotal</span>
                                <span id="summary-subtotal" class="font-medium">$0.00</span>
                            </div>
                            <div class="flex justify-between items-center text-gray-600">
                                <span>Shipping Fee</span>
                                <span id="summary-shipping" class="font-medium">$0.00</span>
                            </div>
                            <div class="flex justify-between items-center border-t pt-3 border-gray-200">
                                <span class="text-xl font-bold text-gray-900">Total Amount</span>
                                <span id="summary-total" class="text-2xl font-extrabold text-primary-600">$0.00</span>
                            </div>
                            
                            <!-- Payment Method -->
                            <div class="flex items-center space-x-3 pt-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                                </svg>
                                <span class="text-sm font-medium text-gray-700">Payment Method: <span id="summary-payment" class="font-semibold text-gray-900"></span></span>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Customer Details (Column 3) -->
                <div class="lg:col-span-1 space-y-6">
                    
                    <!-- 2. Customer and Delivery Details Card -->
                    <div id="customer-details-card" class="card">
                        <h2 class="flex items-center text-xl font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-primary-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                <path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            Customer & Delivery Details
                        </h2>
                        <div id="user-details-list">
                            <!-- User details will be injected here -->
                        </div>
                    </div>

                    <!-- 4. Special Instructions Card -->
                    <div class="card">
                        <h2 class="flex items-center text-xl font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-primary-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                <path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1c-.414 0-.61.168-.707.293L8 20l-1.293-1.707C6.61 18.168 6.414 18 6 18H5a2 2 0 01-2-2V7a2 2 0 012-2h14a2 2 0 012 2v9a2 2 0 01-2 2h-4z" />
                            </svg>
                            Delivery Instructions
                        </h2>
                        <p id="instruction-content" class="text-sm text-gray-700 italic bg-gray-50 p-3 rounded-lg"></p>
                    </div>
                </div>

            </div>
        </div>
        <!-- ---------------------------------------------------------------------- -->

    </div>

    <!-- JavaScript for Data Injection and View Switching -->
    <script>
        // --- Mock Data: Array of Orders ---
        const allOrders = [
            {
                orderId: 'ORD-20251022-54321',
                status: 'Shipped',
                date: '2025-10-22',
                totalAmount: 129.99,
                subtotal: 119.99,
                shippingFee: 10.00,
                user: {
                    name: 'Jane Doe',
                    email: 'jane.doe@example.com',
                    number: '+1 (555) 123-4567',
                    streetAddress: '123 Commerce St',
                    city: 'Springfield',
                    liveLocationAddress: 'Confirmed: 123 Commerce St, Springfield, IL, 62704',
                    instruction: 'Leave package on the back porch, ring bell once. Do not leave in direct sun.',
                    paymentMethod: 'Visa ending in 4242 (Secured)',
                },
                products: [
                    { id: 1, image: 'https://placehold.co/60x60/4f46e5/ffffff?text=HP', name: 'Wireless Noise-Cancelling Headphones', size: 'One Size', dimension: '18 x 15 x 8 cm', category: 'Electronics', price: 89.99, quantity: 1, },
                    { id: 2, image: 'https://placehold.co/60x60/10b981/ffffff?text=DM', name: 'Ergonomic Desk Mat', size: 'XL (90x40cm)', dimension: '90 x 40 x 0.4 cm', category: 'Office Supplies', price: 40.00, quantity: 1, },
                ],
            },
            {
                orderId: 'ORD-20251021-98765',
                status: 'Delivered',
                date: '2025-10-21',
                totalAmount: 49.50,
                subtotal: 45.00,
                shippingFee: 4.50,
                user: {
                    name: 'Mark Smith',
                    email: 'mark.s@corp.com',
                    number: '+1 (555) 987-6543',
                    streetAddress: '45 Pine Ave',
                    city: 'Riverside',
                    liveLocationAddress: '45 Pine Ave, Riverside, CA',
                    instruction: 'Hand to neighbor if not home.',
                    paymentMethod: 'Mastercard ending in 1001',
                },
                products: [
                    { id: 3, image: 'https://placehold.co/60x60/f97316/ffffff?text=TS', name: 'Graphic T-Shirt', size: 'L', dimension: 'NA', category: 'Apparel', price: 24.50, quantity: 2, },
                ],
            },
            {
                orderId: 'ORD-20251020-11223',
                status: 'Processing',
                date: '2025-10-20',
                totalAmount: 350.00,
                subtotal: 340.00,
                shippingFee: 10.00,
                user: {
                    name: 'Alice Johnson',
                    email: 'alice@web.net',
                    number: '+1 (555) 333-2222',
                    streetAddress: '700 Bay Blvd',
                    city: 'Seaside',
                    liveLocationAddress: 'GPS confirmed at apartment door.',
                    instruction: 'Door code 1234#.',
                    paymentMethod: 'PayPal',
                },
                products: [
                    { id: 4, image: 'https://placehold.co/60x60/be185d/ffffff?text=LB', name: 'Leather Backpack', size: 'Large', dimension: '50 x 30 x 20 cm', category: 'Accessories', price: 175.00, quantity: 2, },
                ],
            }
        ];

        // Utility function to create an HTML detail item
        function createDetailItem(label, value, iconSvg) {
            return `
                <div class="flex items-start space-x-3 detail-item">
                    <div class="flex-shrink-0 w-8 h-8 rounded-full bg-primary-50 text-primary-600 flex items-center justify-center mt-0.5">
                        ${iconSvg}
                    </div>
                    <div>
                        <div class="text-xs font-medium text-gray-500">${label}</div>
                        <div class="text-sm font-semibold text-gray-800 break-words">${value}</div>
                    </div>
                </div>
            `;
        }

        // --- View Toggling ---

        function toggleView(view, orderId = null) {
            const listView = document.getElementById('order-list-view');
            const detailView = document.getElementById('order-detail-view');

            if (view === 'list') {
                listView.classList.remove('hidden');
                detailView.classList.add('hidden');
                renderOrderList(allOrders);
            } else if (view === 'detail' && orderId) {
                const order = allOrders.find(o => o.orderId === orderId);
                if (order) {
                    renderOrderDetail(order);
                    listView.classList.add('hidden');
                    detailView.classList.remove('hidden');
                } else {
                    console.error('Order not found:', orderId);
                }
            }
        }

        // --- List View Rendering ---

        function renderOrderList(orders) {
            const tbodyEl = document.getElementById('orders-table-body');
            const statusClasses = {
                'Processing': 'bg-blue-100 text-blue-800',
                'Shipped': 'bg-yellow-100 text-yellow-800',
                'Delivered': 'bg-green-100 text-green-800',
                'Cancelled': 'bg-red-100 text-red-800',
            };

            const tableRows = orders.map(order => {
                const statusClass = statusClasses[order.status] || 'bg-gray-100 text-gray-800';
                return `
                    <tr class="hover:bg-gray-50 cursor-pointer" onclick="toggleView('detail', '${order.orderId}')">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${order.orderId}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${order.date}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-700">${order.user.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass}">
                                ${order.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">$${order.totalAmount.toFixed(2)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button class="text-primary-600 hover:text-primary-900">
                                View Details
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
            tbodyEl.innerHTML = tableRows;
        }

        // --- Detail View Rendering ---

        function renderHeader(order) {
            document.getElementById('detail-order-id').textContent = order.orderId;
            document.getElementById('detail-order-date').textContent = order.date;

            const statusEl = document.getElementById('detail-order-status');
            statusEl.textContent = order.status;

            let statusColor = '';
            switch (order.status) {
                case 'Shipped':
                    statusColor = 'bg-yellow-500';
                    break;
                case 'Delivered':
                    statusColor = 'bg-green-600';
                    break;
                case 'Processing':
                    statusColor = 'bg-blue-500';
                    break;
                case 'Cancelled':
                    statusColor = 'bg-red-500';
                    break;
                default:
                    statusColor = 'bg-gray-500';
            }
            // Clear existing status color classes and apply new ones
            statusEl.className = statusEl.className.replace(/bg-[\w-]+/g, '') + ` ${statusColor}`;
        }

        function renderUserDetails(user) {
            const listEl = document.getElementById('user-details-list');
            
            // Icon SVGs (simplified from lucide-react, optimized for HTML)
            const icons = {
                user: '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
                mail: '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>',
                phone: '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72l1.34 5.36a2 2 0 0 1-.5 2.15L7.79 14 10 16.21l2.84-1.27a2 2 0 0 1 2.15-.5l5.36 1.34A2 2 0 0 1 22 16.92z"/></svg>',
                mapPin: '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
            };

            const items = [
                createDetailItem('Customer Name', user.name, icons.user),
                createDetailItem('Email Address', user.email, icons.mail),
                createDetailItem('Contact Number', user.number, icons.phone),
                createDetailItem('Street Address', `${user.streetAddress}, ${user.city}`, icons.mapPin),
                createDetailItem('Live Location Address', user.liveLocationAddress, icons.mapPin),
            ];

            listEl.innerHTML = items.join('');
            document.getElementById('instruction-content').textContent = user.instruction || 'No special instructions provided.';
        }

        function renderProductDetails(products) {
            const listEl = document.getElementById('product-list');
            listEl.innerHTML = products.map(product => {
                const total = (product.price * product.quantity).toFixed(2);
                return `
                    <div class="flex items-center border-b pb-4 last:border-b-0 last:pb-0">
                        <div class="flex-shrink-0 mr-4">
                            <img
                                src="${product.image}"
                                alt="${product.name}"
                                class="w-16 h-16 rounded-lg object-cover border border-gray-200"
                                onerror="this.onerror=null; this.src='https://placehold.co/60x60/e5e7eb/4b5563?text=N/A';"
                            />
                        </div>
                        <div class="flex-grow">
                            <p class="text-base font-semibold text-gray-900 truncate">${product.name} <span class="text-sm font-normal text-gray-500">x${product.quantity}</span></p>
                            <div class="grid grid-cols-2 text-xs text-gray-600 mt-1 gap-y-1">
                                <span class="truncate"><strong>Size:</strong> ${product.size}</span>
                                <span class="truncate"><strong>Category:</strong> ${product.category}</span>
                                <span class="truncate col-span-2"><strong>Dimension:</strong> ${product.dimension}</span>
                            </div>
                        </div>
                        <div class="text-right flex-shrink-0 ml-4">
                            <p class="text-lg font-bold text-primary-600">$${total}</p>
                            <p class="text-xs text-gray-500">Unit: $${product.price.toFixed(2)}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderSummary(order) {
            document.getElementById('summary-subtotal').textContent = `$${order.subtotal.toFixed(2)}`;
            document.getElementById('summary-shipping').textContent = `$${order.shippingFee.toFixed(2)}`;
            document.getElementById('summary-total').textContent = `$${order.totalAmount.toFixed(2)}`;
            document.getElementById('summary-payment').textContent = order.user.paymentMethod;
        }

        function renderOrderDetail(order) {
            renderHeader(order);
            renderUserDetails(order.user);
            renderProductDetails(order.products);
            renderSummary(order);
        }

        // Execute initial render on window load (Show the list view first)
        window.onload = function() {
            toggleView('list');
        };
    </script>

</body>
</html>
