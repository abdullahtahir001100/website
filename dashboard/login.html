    <style>
        body { 
            background-color: #030303; 
            color: #ffffff; 
            margin: 0; 
            overflow: hidden; /* Prevent scrolling generally */
        }
        
        /* Allow scroll on small heights (landscape mobile) */
        @media (max-height: 700px) {
            body { overflow-y: auto; }
            main { min-height: 100vh; padding-top: 2rem; padding-bottom: 2rem; }
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .input-group {
            position: relative;
            overflow: hidden;
            border-bottom: 2px solid #333;
            transition: border-color 0.3s ease;
        }

        .input-group::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background: #ff2a00;
            transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .input-group:focus-within::after {
            width: 100%;
        }

        .input-group:focus-within {
            border-color: transparent;
        }

        input {
            background: transparent;
            width: 100%;
            padding: 16px 0;
            color: white;
            font-family: 'Space Grotesk', monospace;
            font-size: 16px;
            outline: none;
            letter-spacing: 0.05em;
        }
        
        input::placeholder {
            color: #444;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* Custom Cursor - Only on devices with fine pointer (mouse) */
        @media (hover: hover) and (pointer: fine) {
            .cursor-main {
                position: fixed;
                width: 10px;
                height: 10px;
                background: #ff2a00;
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;
                mix-blend-mode: difference;
                display: block;
            }
            .cursor-follower {
                position: fixed;
                width: 40px;
                height: 40px;
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 50%;
                pointer-events: none;
                z-index: 9998;
                transition: transform 0.15s ease-out;
                display: block;
            }
            body { cursor: none; }
        }
        
        @media (hover: none) or (pointer: coarse) {
            .cursor-main, .cursor-follower { display: none !important; }
            body { cursor: auto; }
        }

        /* Glitch Text Effect */
        .glitch-text {
            position: relative;
        }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #030303;
        }
        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 #00fff9;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(31px, 9999px, 94px, 0); }
            5% { clip: rect(70px, 9999px, 14px, 0); }
            10% { clip: rect(25px, 9999px, 60px, 0); }
            15% { clip: rect(6px, 9999px, 83px, 0); }
            20% { clip: rect(81px, 9999px, 47px, 0); }
            25% { clip: rect(54px, 9999px, 98px, 0); }
            30% { clip: rect(93px, 9999px, 32px, 0); }
            35% { clip: rect(11px, 9999px, 5px, 0); }
            40% { clip: rect(49px, 9999px, 98px, 0); }
            45% { clip: rect(70px, 9999px, 20px, 0); }
            50% { clip: rect(27px, 9999px, 86px, 0); }
            55% { clip: rect(34px, 9999px, 10px, 0); }
            60% { clip: rect(9px, 9999px, 50px, 0); }
            65% { clip: rect(61px, 9999px, 84px, 0); }
            70% { clip: rect(10px, 9999px, 65px, 0); }
            75% { clip: rect(93px, 9999px, 66px, 0); }
            80% { clip: rect(30px, 9999px, 96px, 0); }
            85% { clip: rect(51px, 9999px, 29px, 0); }
            90% { clip: rect(56px, 9999px, 78px, 0); }
            95% { clip: rect(28px, 9999px, 51px, 0); }
            100% { clip: rect(48px, 9999px, 63px, 0); }
        }

        /* Scanline Overlay */
        .scanlines {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 50;
        }

    <script>
        // --- 1. Three.js Background ---
        const initThreeJS = () => {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030303, 0.002);

            // Responsive Camera Setup
            const getCameraZ = () => {
                if (window.innerWidth < 768) return 30; // Further back on mobile
                return 20; // Closer on desktop
            };

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = getCameraZ();

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limit pixel ratio for performance on high-dpi mobile
            container.appendChild(renderer.domElement);

            // Create Particles
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = window.innerWidth < 768 ? 1500 : 3000; // Reduce particles on mobile
            const posArray = new Float32Array(particlesCount * 3);

            for(let i = 0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 80;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.03,
                color: 0xff3c00,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);

            // Create Grid
            const gridHelper = new THREE.GridHelper(100, 50, 0x333333, 0x111111);
            gridHelper.position.y = -10;
            scene.add(gridHelper);

            // Icosahedron
            const icoGeometry = new THREE.IcosahedronGeometry(8, 0);
            const icoMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x222222, 
                wireframe: true,
                transparent: true,
                opacity: 0.2
            });
            const icoMesh = new THREE.Mesh(icoGeometry, icoMaterial);
            scene.add(icoMesh);


            // Animation Logic
            let mouseX = 0;
            let mouseY = 0;
            let targetX = 0;
            let targetY = 0;

            const windowHalfX = window.innerWidth / 2;
            const windowHalfY = window.innerHeight / 2;

            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX - windowHalfX);
                mouseY = (event.clientY - windowHalfY);
            });
            
            // Touch support for interaction
            document.addEventListener('touchmove', (event) => {
                if (event.touches.length > 0) {
                    mouseX = (event.touches[0].clientX - windowHalfX);
                    mouseY = (event.touches[0].clientY - windowHalfY);
                }
            }, { passive: true });

            const clock = new THREE.Clock();

            const animate = () => {
                const elapsedTime = clock.getElapsedTime();

                targetX = mouseX * 0.001;
                targetY = mouseY * 0.001;

                particlesMesh.rotation.y += 0.001;
                particlesMesh.rotation.x += 0.0005;

                icoMesh.rotation.x += 0.002;
                icoMesh.rotation.y += 0.002;

                // Smoother lerp
                particlesMesh.rotation.y += 0.05 * (targetX - particlesMesh.rotation.y);
                particlesMesh.rotation.x += 0.05 * (targetY - particlesMesh.rotation.x);

                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            };

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.position.z = getCameraZ(); // Update Z on resize
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };

        // --- 2. Custom Cursor (GSAP) - Only initialized if media query matches CSS ---
        const initCursor = () => {
            if (window.matchMedia("(hover: none)").matches) return; // Skip on touch devices

            const cursor = document.querySelector('.cursor-main');
            const follower = document.querySelector('.cursor-follower');
            
            if (!cursor || !follower) return;

            gsap.set(cursor, {xPercent: -50, yPercent: -50});
            gsap.set(follower, {xPercent: -50, yPercent: -50});

            window.addEventListener('mousemove', e => {
                gsap.to(cursor, {x: e.clientX, y: e.clientY, duration: 0.1});
                gsap.to(follower, {x: e.clientX, y: e.clientY, duration: 0.3});
            });

            const hoverTargets = document.querySelectorAll('input, button, a');
            hoverTargets.forEach(el => {
                el.addEventListener('mouseenter', () => {
                    gsap.to(follower, {
                        scale: 2, 
                        backgroundColor: 'rgba(255, 60, 0, 0.1)', 
                        borderColor: '#ff3c00', 
                        duration: 0.3
                    });
                });
                el.addEventListener('mouseleave', () => {
                    gsap.to(follower, {
                        scale: 1, 
                        backgroundColor: 'transparent', 
                        borderColor: 'rgba(255,255,255,0.3)', 
                        duration: 0.3
                    });
                });
            });
        };

        // --- 3. Lottie Animation ---
        const initLottie = () => {
            lottie.loadAnimation({
                container: document.getElementById('lottie-lock'),
                renderer: 'svg',
                loop: true,
                autoplay: true,
                path: 'https://lottie.host/8b724128-0689-408a-a4be-21cb8861498b/4K6Q7w3qj5.json' 
            });
        };

        // --- 4. Intro Animations (GSAP + Anime.js) ---
        const initIntro = () => {
            // Top border scan
            anime({
                targets: '#top-border',
                translateX: ['-100%', '100%'],
                easing: 'linear',
                duration: 2500,
                loop: true
            });

            const tl = gsap.timeline();
            
            // Panel Entrance
            tl.fromTo('.glass-panel', 
                { opacity: 0, scale: 0.9, rotateX: 10, y: 50 },
                { opacity: 1, scale: 1, rotateX: 0, y: 0, duration: 1.2, ease: "power4.out" }
            )
            // Staggered Text & Inputs
            .from('.glitch-text', {
                opacity: 0, x: -20, duration: 0.8, ease: "power2.out"
            }, "-=0.8")
            .from('form > div', {
                opacity: 0, y: 20, stagger: 0.2, duration: 0.8, ease: "back.out(1.7)"
            }, "-=0.6")
            .from('.input-group::after', {
                width: 0, duration: 0.8, ease: "power2.inOut"
            }, "-=0.4");
        };

        // --- 5. Lenis Smooth Scroll ---
        const initLenis = () => {
            const lenis = new Lenis();
            function raf(time) {
                lenis.raf(time);
                requestAnimationFrame(raf);
            }
            requestAnimationFrame(raf);
        };


        // --- MAIN INIT ---
        window.addEventListener('DOMContentLoaded', () => {
            initThreeJS();
            initCursor();
            initLottie();
            initIntro();
            initLenis();

            // --- Toggle Forms Logic ---
            const loginSection = document.getElementById('loginSection');
            const forgotSection = document.getElementById('forgotSection');
            const resetSection = document.getElementById('resetSection');

            const showForgotBtn = document.getElementById('showForgotBtn');
            const showLoginBtn = document.getElementById('showLoginBtn');
            const backToForgotBtn = document.getElementById('backToForgotBtn');

            // API ENDPOINTS
            const API_LOGIN = 'https://backend-web-1.vercel.app/api/auth/login';
            const API_FORGOT = 'https://backend-web-1.vercel.app/api/auth/forgot-password'; // Updated backend logic
            const API_RESET = 'https://backend-web-1.vercel.app/api/auth/reset-password';

            // Animation Helper
            const switchSection = (hideEl, showEl, direction = 1) => {
                const tl = gsap.timeline();
                tl.to(hideEl, {
                    opacity: 0,
                    x: -20 * direction,
                    duration: 0.3,
                    ease: "power2.in",
                    onComplete: () => {
                        hideEl.classList.add('hidden');
                        showEl.classList.remove('hidden');
                        gsap.set(showEl, { opacity: 0, x: 20 * direction });
                    }
                })
                .to(showEl, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" });
            };

            // Switch: Login -> Forgot
            showForgotBtn.addEventListener('click', () => switchSection(loginSection, forgotSection, 1));

            // Switch: Forgot -> Login
            showLoginBtn.addEventListener('click', () => switchSection(forgotSection, loginSection, -1));

            // Switch: Reset -> Forgot (Resend OTP flow)
            backToForgotBtn.addEventListener('click', () => switchSection(resetSection, forgotSection, -1));


            // --- 1. Forgot Password Logic (Dispatch OTP) ---
            document.getElementById('forgotForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('forgotBtn');
                const btnText = btn.querySelector('span');
                const originalText = btnText.innerText;
                const email = document.getElementById('forgotEmail').value;
                
                btnText.innerText = "OPENING_CHANNEL...";
                gsap.to(btn, { opacity: 0.8 });

                try {
                    const res = await fetch(API_FORGOT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    const data = await res.json();

                    if(res.ok) {
                        // Success -> Move to OTP Reset Screen
                        btnText.innerText = "OTP_SENT";
                        gsap.to(btn, { backgroundColor: '#22c55e', color: '#fff' });
                        
                        setTimeout(() => {
                             switchSection(forgotSection, resetSection, 1);
                             // Reset button styles
                             btnText.innerText = originalText;
                             gsap.to(btn, { backgroundColor: '', color: '' });
                        }, 500);

                    } else {
                        throw new Error(data.message || 'Dispatch Failed');
                    }

                } catch (error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'TRANSMISSION_ERROR',
                        text: error.message,
                        background: '#0a0a0a',
                        color: '#fff',
                        confirmButtonColor: '#ff2a00'
                    });
                    btnText.innerText = "RETRY_DISPATCH";
                }
            });

            // --- 2. Reset Password Logic (Verify OTP) ---
            document.getElementById('resetForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('resetBtn');
                const btnText = btn.querySelector('span');
                
                const email = document.getElementById('forgotEmail').value; // Get saved email
                const otp = document.getElementById('otpCode').value;
                const newPassword = document.getElementById('newPassword').value;

                btnText.innerText = "VERIFYING_HASH...";
                gsap.to(btn, { opacity: 0.8 });

                try {
                    const res = await fetch(API_RESET, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, otp, newPassword })
                    });
                    const data = await res.json();

                    if(res.ok) {
                        btnText.innerText = "ACCESS_UPDATED";
                        gsap.to(btn, { backgroundColor: '#22c55e', color: '#fff' });

                        Swal.fire({
                             icon: 'success',
                             title: 'PROTOCOL_COMPLETE',
                             text: 'Access Hash Updated. Redirecting to Gateway.',
                             background: '#0a0a0a',
                             color: '#fff',
                             timer: 2000,
                             showConfirmButton: false
                        }).then(() => {
                             switchSection(resetSection, loginSection, 1);
                        });

                    } else {
                         throw new Error(data.message || 'Verification Failed');
                    }

                } catch (error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'INVALID_HASH',
                        text: error.message,
                        background: '#0a0a0a',
                        color: '#fff',
                        confirmButtonColor: '#ff2a00'
                    });
                    btnText.innerText = "RETRY_UPDATE";
                }
            });

            // --- Authenticate Logic ---
            const API_URL = 'https://backend-web-1.vercel.app/api/auth/login';

            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('loginBtn');
                const btnText = btn.querySelector('span');

                // State: Loading
                btnText.innerText = "AUTHENTICATING...";
                gsap.to(btn, { backgroundColor: '#ffffff', color: '#000', duration: 0.3 }); // Flash white
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await res.json();

                    if (res.ok) {
                        localStorage.setItem('authToken', data.token || 'demo-token');
                        if(data.user) localStorage.setItem('user', JSON.stringify(data.user));

                        // State: Success
                        btnText.innerText = "ACCESS GRANTED";
                        gsap.to(btn, { backgroundColor: '#22c55e', color: '#fff', duration: 0.5 }); // Green
                        
                        // Warp Out Animation
                        const timeline = gsap.timeline();
                        timeline.to('.glass-panel', { 
                            scale: 1.5, 
                            opacity: 0, 
                            filter: 'blur(20px)',
                            duration: 0.8, 
                            ease: "power2.in" 
                        })
                        .to('#canvas-container canvas', {
                            scale: 5,
                            opacity: 0,
                            duration: 1,
                            ease: "power2.in"
                        }, "-=0.8");

                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1000);
                    } else {
                        throw new Error(data.message || 'Invalid Credentials');
                    }
                } catch (error) {
                    // State: Error
                    // Shake Effect
                    gsap.fromTo('.glass-panel', 
                        { x: -10 },
                        { x: 10, duration: 0.08, repeat: 5, yoyo: true, ease: "none", onComplete: () => {
                            gsap.to('.glass-panel', { x: 0, duration: 0.1 });
                        }}
                    );
                    
                    // Flash Red
                    const overlay = document.createElement('div');
                    overlay.style.position = 'fixed';
                    overlay.style.inset = '0';
                    overlay.style.backgroundColor = 'rgba(255, 0, 0, 0.2)';
                    overlay.style.zIndex = '40';
                    overlay.style.pointerEvents = 'none';
                    document.body.appendChild(overlay);
                    gsap.to(overlay, { opacity: 0, duration: 0.5, onComplete: () => overlay.remove() });

                    Swal.fire({
                        icon: 'error',
                        title: 'ACCESS DENIED',
                        text: error.message,
                        background: '#0a0a0a',
                        color: '#fff',
                        confirmButtonColor: '#ff2a00',
                        customClass: {
                            popup: 'border border-red-900'
                        }
                    });
                    
                    btnText.innerText = "Authenticate";
                    gsap.to(btn, { backgroundColor: '#fff', color: '#000', duration: 0.3 });
                }
            });
        });
    </script>
</body>
</html>
