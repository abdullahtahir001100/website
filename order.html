<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta property="og:title" content="Live Order Tracking | INKBYHAND Status Portal">
    <meta property="og:description" content="Track your INKBYHAND order in real time, monitor fulfillment progress, and stay updated from confirmation to delivery.">

    <meta property="og:url" content="https://inkbyhand.store/order.html">
    <meta property="og:image" content="https://inkbyhand.store/favicon.png">
    <meta property="og:updated_time" content="2026-03-28T00:00:00Z">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Live Order Tracking | INKBYHAND Status Portal">
    <meta name="twitter:description" content="Track your INKBYHAND order in real time, monitor fulfillment progress, and stay updated from confirmation to delivery.">
    <meta name="twitter:image" content="https://inkbyhand.store/favicon.png">

    <link rel="canonical" href="https://inkbyhand.store/order.html">
    <link rel="icon" type="image/svg+xml" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <title>Live Order Tracking | INKBYHAND Status Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.css">
    <style>
        :root { --bg: #050505; --text: #ffffff; --accent: #ff3c00; }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; overflow-x: hidden; opacity: 0; transition: opacity 0.5s ease; }
        body.loaded { opacity: 1; }
        h1, h2, h3, .font-syne { font-family: 'Syne', sans-serif; }
        
        /* Lenis */
        html.lenis { height: auto; }
        .lenis.lenis-smooth { scroll-behavior: auto; }
        
        /* Cursor */
        .cursor-dot { position: fixed; top: 0; left: 0; width: 8px; height: 8px; background: white; border-radius: 50%; pointer-events: none; z-index: 9999; mix-blend-mode: difference; }
        .cursor-circle { position: fixed; top: 0; left: 0; width: 40px; height: 40px; border: 1px solid rgba(255,255,255,0.5); border-radius: 50%; pointer-events: none; z-index: 9998; transition: width 0.3s, height 0.3s; }
        body.hovering .cursor-circle { width: 80px; height: 80px; background: rgba(255,255,255,0.1); border-color: transparent; }

        /* UI */
        .fixed-header { position: fixed; top: 0; left: 0; width: 100%; padding: 30px 5%; display: flex; justify-content: space-between; align-items: center; z-index: 2200; mix-blend-mode: difference; }
        .logo { font-size: 1.5rem; font-weight: 700; font-family: 'Syne', sans-serif; text-transform: uppercase; color: #fff; text-decoration: none; }
        
        .container { min-height: 100vh; padding: 150px 5% 50px; display: flex; flex-direction: column; align-items: center; }
        
        .search-box {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin-bottom: 50px;
            border-bottom: 2px solid #333;
        }
        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            padding: 20px;
            font-size: 1.5rem;
            font-family: 'Syne', sans-serif;
            text-align: center;
            outline: none;
        }
        .search-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .search-btn:hover { opacity: 1; }

        .order-card {
            width: 100%;
            max-width: 800px;
            background: #111;
            padding: 40px;
            border: 1px solid #222;
            opacity: 0;
            transform: translateY(50px);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border: 1px solid #fff;
            border-radius: 50px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .order-grid {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #222;
        }

        .burger { cursor: pointer; display: flex; flex-direction: column; gap: 6px; z-index: 2300; }
        .burger div { width: 30px; height: 2px; background: #fff; transition: 0.3s; }
        
        /* Nav Overlay */
        .nav-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #000; z-index: 2100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.5s;
        }
        .nav-overlay.active { opacity: 1; pointer-events: all; }
        .nav-link { font-size: 3rem; color: #fff; text-decoration: none; margin: 10px; font-family: 'Syne'; opacity: 0; transform: translateY(20px); transition: 0.5s; }
        .nav-overlay.active .nav-link { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            .order-grid { grid-template-columns: 1fr; }
            .nav-link { font-size: 2rem; }
        }
    </style>
    
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-circle"></div>

    <header class="fixed-header">
        <a href="index.html" class="logo">INKBYHAND</a>
        <div class="burger" id="burger">
            <div></div><div></div>
        </div>
    </header>

    <div class="nav-overlay" id="nav">
        <a href="index.html" class="nav-link" style="transition-delay: 0.1s">HOME</a>
        <a href="product.html" class="nav-link" style="transition-delay: 0.2s">ARCHIVE</a>
        <a href="order.html" class="nav-link" style="transition-delay: 0.3s">ORDER STATUS</a>
        <a href="about.html" class="nav-link" style="transition-delay: 0.4s">ABOUT</a>
        <a href="contact.html" class="nav-link" style="transition-delay: 0.5s">CONTACT</a>
    </div>

    <!-- Main Content -->
    <div class="container">
        <h1 style="font-size: 3rem; margin-bottom: 10px; text-align: center;">TRACK ORDER</h1>
        <p style="color: #666; margin-bottom: 40px; text-align: center;">Enter your Order ID to view details.</p>

        <div class="search-box">
            <input type="text" class="search-input" id="orderIdInput" placeholder="ORDER ID...">
            <button class="search-btn" id="searchBtn">➔</button>
        </div>

        <button id="viewHistoryBtn" style="background: transparent; border: 1px solid #333; color: #888; padding: 10px 20px; font-family: 'Space Grotesk'; cursor: pointer; transition: 0.3s; margin-bottom: 20px;">
            VIEW PREVIOUS ORDERS
        </button>

        <div id="wrapper" style="width: 100%; max-width: 1200px; display: flex; flex-direction: column; align-items: center; gap: 40px;">
            <div id="resultArea" style="width: 100%; max-width: 800px;"></div>
            <div id="historyArea" style="width: 100%; max-width: 800px; display: none;"></div>
        </div>
    </div>
    
    <style>
        @media (min-width: 1024px) {
            #wrapper { 
                flex-direction: row; 
                align-items: flex-start; 
                justify-content: center;
            }
            #resultArea { flex: 2; margin-right: 20px;}
            #historyArea { flex: 1; max-width: 400px; margin-top: 0 !important; }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <script>
        // Setup
        const lenis = new Lenis();
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);
        document.body.classList.add('loaded');

        // Cursor
        const dot = document.querySelector('.cursor-dot');
        const circle = document.querySelector('.cursor-circle');
        window.addEventListener('mousemove', (e) => {
            gsap.to(dot, { x: e.clientX, y: e.clientY, duration: 0 });
            gsap.to(circle, { x: e.clientX, y: e.clientY, duration: 0.15 });
        });

        // Menu
        const burger = document.getElementById('burger');
        const nav = document.getElementById('nav');
        let navOpen = false;
        burger.onclick = () => {
            navOpen = !navOpen;
            nav.classList.toggle('active');
            const lines = burger.querySelectorAll('div');
            if(navOpen){
                gsap.to(lines[0], { y: 8, rotation: 45 });
                gsap.to(lines[1], { y: -0, rotation: -45 });
                // Note: The previous logic was y:4 and y:-4, but gaps might differ. 
                // Let's adjust to be safe or use simple transforms like index.html
                // actually index.html uses specific styling logic. 
                // Let's try to match the index.html logic but with GSAP since we have it here.
            } else {
                gsap.to(lines, { y: 0, rotation: 0 });
            }
        };

        // Logic
        const API_URL = 'https://backend-web-1.vercel.app/api/orders';

        const viewHistoryBtn = document.getElementById('viewHistoryBtn');
        const historyArea = document.getElementById('historyArea');

        const wrapper = document.getElementById('wrapper');
        
        viewHistoryBtn.addEventListener('click', () => {
             // Toggle Logic adapted for mobile and desktop
            const currentDisplay = window.getComputedStyle(historyArea).display;
            
            if(currentDisplay === 'none') {
                historyArea.style.display = 'block';
                if(window.innerWidth >= 1024) wrapper.style.display = 'flex';
                fetchHistory();
                viewHistoryBtn.innerText = 'HIDE ORDERS';
            } else {
                historyArea.style.display = 'none';
                if(window.innerWidth >= 1024) wrapper.style.display = 'block';
                viewHistoryBtn.innerText = 'VIEW PREVIOUS ORDERS';
            }
        });

        async function fetchHistory() {
            historyArea.innerHTML = '<div style="text-align:center; color:#666;">Loading...</div>';
            try {
                // Get Local Order IDs
                const myOrderIds = JSON.parse(localStorage.getItem('myOrderIds')) || [];
                const pendingId = localStorage.getItem('pendingOrderId');
                if(pendingId && !myOrderIds.includes(pendingId)) myOrderIds.push(pendingId);

                if(myOrderIds.length === 0) {
                    historyArea.innerHTML = '<div style="text-align:center; color:#666;">No previous orders found on this device.</div>';
                    return;
                }

                const res = await fetch(`${API_URL}`);
                const response = await res.json();
                const allOrders = response.data || [];

                // Filter stored IDs
                const orders = allOrders.filter(o => myOrderIds.includes(o._id));
                
                // Sort by date desc
                orders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

                if(orders.length === 0) {
                    historyArea.innerHTML = '<div style="text-align:center; color:#666;">No matching orders found.</div>';
                    return;
                }

                historyArea.innerHTML = '<h3 style="margin-bottom:20px; font-size:1.2rem; border-bottom: 1px solid #333; padding-bottom:10px;">YOUR HISTORY</h3>';
                
                orders.forEach(order => {
                    const el = document.createElement('div');
                    el.style.borderBottom = '1px solid #222';
                    el.style.padding = '15px 0';
                    el.style.cursor = 'pointer';
                    el.style.display = 'flex';
                    el.style.justifyContent = 'space-between';
                    el.style.alignItems = 'center';
                    el.style.transition = '0.3s';
                    
                    el.onmouseover = () => { el.style.background = '#111'; el.style.paddingLeft = '10px'; };
                    el.onmouseout = () => { el.style.background = 'transparent'; el.style.paddingLeft = '0'; };

                    el.innerHTML = `
                        <div>
                            <div style="font-weight:bold; color:#fff;">Order #${order._id.slice(-6).toUpperCase()}</div>
                            <div style="font-size:0.8rem; color:#666;">${new Date(order.createdAt).toLocaleDateString()}</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="color:${order.status === 'Pending' ? '#ff3c00' : '#fff'}; font-size:0.8rem;">${order.status}</div>
                            <div style="font-weight:bold;">Rs. ${order.totalAmount}</div>
                        </div>
                    `;

                    el.onclick = () => {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        document.getElementById('orderIdInput').value = order._id;
                        renderOrder(order);
                    };

                    historyArea.appendChild(el);
                });

                // Animate In List
                anime({
                    targets: historyArea.children,
                    opacity: [0, 1],
                    translateY: [20, 0],
                    delay: anime.stagger(50),
                    easing: 'easeOutExpo'
                });

                // Force layout update for Flexbox
                const wrapper = document.getElementById('wrapper');
                if(window.innerWidth >= 1024) {
                    wrapper.style.display = 'flex';
                    historyArea.style.display = 'block';
                }

            } catch(e) {
                console.error(e);
                historyArea.innerHTML = '<div style="text-align:center; color:red;">Connection Error.</div>';
            }
        }

        async function fetchOrder(id) {
            const resArea = document.getElementById('resultArea');
            const searchStatus = document.createElement('div');
            searchStatus.style.textAlign = 'center';
            searchStatus.style.color = '#888';
            searchStatus.innerText = 'Searching...';
            resArea.innerHTML = '';
            resArea.appendChild(searchStatus);
            
            try {
                const res = await fetch(`${API_URL}`);
                const response = await res.json();
                
                // Access the 'data' array from the response object
                const orders = response.data || [];
                const order = orders.find(o => o._id === id);

                if(order) {
                    renderOrder(order);
                } else {
                    resArea.innerHTML = '<div style="text-align:center; color:#ff3c00; margin-top: 20px;">Order Not Found.</div>';
                }
            } catch(e) {
                console.error(e);
                resArea.innerHTML = '<div style="text-align:center; color:red; margin-top: 20px;">Connection Error.</div>';
            }
        }

        function renderOrder(order) {
            const resArea = document.getElementById('resultArea');
            resArea.innerHTML = ''; // Clear loading message

            const itemsHtml = order.items.map(i => `
                <div class="item-row">
                    <span>${i.productName} (x${i.quantity}) - ${i.variant}</span>
                    <span>Rs. ${i.price * i.quantity}</span>
                </div>
            `).join('');

            const discountRow = order.discountAmount ? `
                <div class="item-row" style="color: #ff3c00;">
                    <span>Discount (${order.discountCode || 'Applied'})</span>
                    <span>${order.discountAmount}</span>
                </div>` : '';

            const shippingRow = `
                <div class="item-row">
                    <span>Shipping Fee</span>
                    <span>Rs. ${order.shippingFee}</span>
                </div>`;

            const card = document.createElement('div');
            card.className = 'order-card';
            card.innerHTML = `
                <div style="text-align:center; border-bottom:1px solid #222; padding-bottom:20px; margin-bottom:20px;">
                    <div class="status-badge" style="border-color:${order.status === 'Pending' ? '#ff3c00' : '#fff'}">${order.status || 'Processing'}</div>
                    <h2 style="font-size:1.2rem; margin-bottom: 5px;">ORDER #${order._id.slice(-6).toUpperCase()}</h2>
                    <p style="color:#666; font-size: 0.8rem;">ID: ${order._id}</p>
                    <p style="color:#666; font-size: 0.8rem;">${new Date(order.createdAt).toLocaleString()}</p>
                </div>
                
                <div style="font-family:'Space Grotesk';">
                    <h3 style="margin-bottom: 15px;">ITEMS</h3>
                    <div style="margin-bottom: 20px;">
                        ${itemsHtml}
                    </div>
                    
                    <div style="border-top:1px solid #222; padding-top:10px; margin-bottom: 20px;">
                        <div class="item-row">
                            <span>Subtotal</span>
                            <span>Rs. ${order.subtotalAmount}</span>
                        </div>
                        ${shippingRow}
                        ${discountRow}
                    </div>

                    <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.5rem; border-top:1px solid #333; padding-top:20px;">
                        <span>TOTAL</span>
                        <span>Rs. ${order.totalAmount}</span>
                    </div>
                </div>

                <div class="order-grid">
                    <div>
                        <h4 style="color:#666; font-size:0.8rem; margin-bottom: 10px;">SHIPPING TO</h4>
                        <p style="text-transform: capitalize;">${order.customerName}</p>
                        <p>${order.shippingAddress.streetAddress}</p>
                        <p>${order.shippingAddress.city}, ${order.shippingAddress.country}</p>
                        ${order.shippingAddress.province !== 'N/A' ? `<p>${order.shippingAddress.province}</p>` : ''}
                    </div>
                    <div>
                        <h4 style="color:#666; font-size:0.8rem; margin-bottom: 10px;">CONTACT</h4>
                        <p>${order.customerPhone}</p>
                        <p>${order.customerEmail}</p>
                    </div>
                </div>
                
                ${order.statusUpdates && order.statusUpdates.length > 0 ? `
                <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #222;">
                    <h4 style="color:#666; font-size:0.8rem; margin-bottom: 15px;">UPDATES</h4>
                    ${order.statusUpdates.map(u => `
                        <div style="font-size: 0.9rem; margin-bottom: 10px;">
                            <span style="color: #ff3c00; margin-right: 10px;">${new Date(u.date).toLocaleDateString()}</span>
                            <span>${u.note}</span>
                        </div>
                    `).join('')}
                </div>` : ''}
            `;
            
            resArea.appendChild(card);

            // Animate In
            anime({
                targets: '.order-card',
                translateY: [50, 0],
                opacity: [0, 1],
                duration: 800,
                easing: 'easeOutExpo'
            });
        }

        // Search Events
        const input = document.getElementById('orderIdInput');
        
        document.getElementById('searchBtn').onclick = () => {
            if(input.value) fetchOrder(input.value.trim());
        };

        input.addEventListener('keypress', (e) => {
            if(e.key === 'Enter' && input.value) fetchOrder(input.value.trim());
        });

        // Auto Load
        const pendingId = localStorage.getItem('pendingOrderId');
        if(pendingId) {
            input.value = pendingId;
            fetchOrder(pendingId);
            // Optional: clear it after viewing once? 
            // localStorage.removeItem('pendingOrderId'); 
        }

    </script>
</body>
</html>
