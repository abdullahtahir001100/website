<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart</title>
    <!-- Load Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">


</head>

<body>

    <!-- Header Section -->
  <header class="main-header">
        <div class="header-content">
            <a href="/" class="header-logo">
                <img src="https://inkbyhand.com/wp-content/uploads/2025/08/Main-Logo-2-e1756815161444.png" alt="INKBYHAND Logo" class="logo-img">
            </a>

            <div class="icon-nav-container">
                
                 <div id="auth-container" class="auth-container">
                    </div>

                <div class="cart-icon-container" onclick="window.location.href='cart.html'">
                    <i class="fas fa-shopping-cart"></i>
                </div>

                <div id="menu-icon-container" class="menu-icon-container" onclick="toggleBurgerMenu(event)">
                    <i class="fas fa-bars"></i>
                    <div id="burger-menu-dropdown" class="burger-menu-dropdown">
                        <a href="product.html">Shop</a>
                        <a href="about.html">About Us</a>
                        <a href="contect.html">Contact</a> 
                        <a href="order.html">Yours Orders</a>
                        
                    </div>
                </div>

                
                
               
                
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 md:py-10">

        <div class="flex justify-between items-end mb-8">
            <h1 id="cardHead" class="text-3xl md:text-4xl font-extrabold text-gray-900">
                Your cart
            </h1>
            <a href="product.html"
                class="text-base font-semibold text-gray-700 hover:text-gray-900 transition-colors border-b border-gray-700 pb-0.5">
                Continue shopping
            </a>
        </div>


        <!-- Empty Cart State -->
        <div id="emptyCart" class="text-center bg-white p-10 rounded-xl shadow-lg" style="display: none;">
            <svg class="w-16 h-16 mx-auto text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z">
                </path>
            </svg>
            <h2 class="text-2xl font-bold mt-4">Your cart is empty</h2>
            <p class="text-gray-500 mt-2">Looks like you haven't added anything to your cart yet.</p>
            <a href="product.html"
                class="mt-6 inline-block bg-orange-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-orange-700 transition-colors">
                Start Shopping
            </a>
        </div>

        <!-- Full Cart Content Wrapper -->
        <div id="fullCartContent" class="cart-content-wrapper" style="display: none;">

            <!-- Left Column: Cart Items and Instructions -->
            <div class="scroll">
                <div class="cart-items-container">

                    <!-- Cart Header Row (Grid for alignment) -->
                    <div class="cart-list-header">
                        <div class="header-prod">PRODUCT</div>
                        <div class="header-qty">QUANTITY</div>
                        <div class="header-total">TOTAL</div>
                    </div>

                    <!-- Cart Items Body (Populated by JS) -->
                    <div id="cart-items">
                        <!-- Items will be inserted here -->
                    </div>

                    <!-- Order Special Instructions -->

                </div>
            </div>
            <div class="flex border-t border-gray-200" id="none">
                <div class="ins">
                    <h3 class="block text-lg font-semibold text-gray-800 mb-2">Order special instructions</h3>
                    <textarea id="special-instructions" rows="4" class="text"></textarea>
                </div>
                <!-- Right Column: Cart Summary -->
                <div id="cartSummary" class="cart-summary-column">
                    <div class="summary-card">
                        <!-- Subtotal Row -->
                        <div class="summary-row font-semibold text-gray-900">
                            <span class="text-xl">Subtotal</span>
                            <span id="cartSubtotal" class="font-bold text-xl">0 Rs</span>
                        </div>

                        <!-- Taxes/Info Row -->
                        <p class="text-sm text-gray-500 text-right mt-0 mb-4">
                            Taxes and shipping calculated at checkout
                        </p>

                        <!-- Checkout Button -->
                        <a href="paymant.html"
                            class="mt-2 block w-full text-center py-3 bg-orange-600 text-white font-bold rounded-lg shadow-lg hover:bg-orange-700 transition-colors text-lg">
                            Check out
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Section -->
    <script src="js/cockees.js"></script>
    <script src="js/cart.js"></script>
</body>

</html>
