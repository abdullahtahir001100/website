<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INKBYHAND | Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --bg-deep: #0a0a0a;
            --bg-mid: #141414;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none !important; /* Custom cursor everywhere */
        }

        body {
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .playfair {
            font-family: 'Playfair Display', serif;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* Cursor */
        .cursor {
            width: 8px; height: 8px; background: #fff; position: fixed; pointer-events: none; z-index: 10000; mix-blend-mode: difference; border-radius: 50%;
        }
        .cursor-follower {
            width: 40px; height: 40px; border: 1px solid rgba(255, 255, 255, 0.5); position: fixed; pointer-events: none; z-index: 9999; border-radius: 50%; transition: transform 0.15s ease-out;
        }

        /* Header */
        .main-header {
            position: fixed; top: 0; width: 100%; z-index: 2200; background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(15px); padding: 25px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);
        }
        .header-logo img { width: 100px; filter: invert(1); }
        .burger { cursor: pointer; z-index: 2300; padding: 10px; }
        .burger div { width: 25px; height: 1px; background: white; margin: 6px; transition: 0.4s; }

        /* Menu Overlay */
        .nav-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #000; z-index: 2100; display: flex; align-items: center; justify-content: center; transform: scale(1.1); opacity: 0; pointer-events: none; transition: all 0.6s cubic-bezier(0.85, 0, 0.15, 1);
        }
        .nav-overlay.active { transform: scale(1); opacity: 1; pointer-events: all; }
        .nav-links a { display: block; font-size: 5vw; color: white; margin: 10px 0; font-family: 'Playfair Display'; opacity: 0; transform: translateY(50px); transition: 0.6s; }
        .nav-overlay.active .nav-links a { opacity: 1; transform: translateY(0); transition-delay: calc(0.1s * var(--i)); }

        /* --- CART PAGE STYLES --- */
        .page-spacer { height: 140px; }
        .cart-container {
            padding: 0 5%;
            min-height: 60vh;
            max-width: 1400px;
            margin: 0 auto;
        }

        .cart-title {
            font-size: 4vw;
            margin-bottom: 60px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 40px;
        }

        /* Empty Cart */
        #emptyCart { display: none; padding: 100px 0; text-align: center; }

        /* Full Cart Layout */
        #fullCartContent {
            display: none; /* Flex when active */
            flex-direction: column;
            gap: 40px;
        }

        /* Cart Head (Desktop) */
        #cardHead {
            display: flex;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Cart Items */
        .cart-product-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px 0;
            border-bottom: 1px solid var(--border-color);
            opacity: 0; 
            animation: fadeIn 0.5s forwards;
        }
        @keyframes fadeIn { to { opacity: 1; } }

        .product-details-group {
            display: flex;
            align-items: center;
            gap: 30px;
            flex: 2;
        }

        .product-image {
            width: 100px;
            height: 120px;
            object-fit: cover;
            background: #222;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .product-name {
            font-family: 'Playfair Display';
            font-size: 1.5rem;
        }

        .product-price-inline {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Quantity */
        .qty-column {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid var(--border-color);
            padding: 5px 15px;
        }
        
        .quantity-input {
            width: 40px;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-size: 1rem;
        }
        
        .qty-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            width: 20px;
        }

        /* Total & Remove */
        .total-column {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 30px;
            font-size: 1.2rem;
        }

        .remove-btn {
            cursor: pointer;
            opacity: 0.5;
            transition: 0.3s;
            color: #fff; /* If using icon */
            width: 20px; /* If using image */
        }
        .remove-btn:hover { opacity: 1; color: #ff4444; }

        /* Summary Panel */
        .cart-summary {
            margin-top: 60px;
            padding-top: 40px;
            display: flex;
            justify-content: flex-end;
        }

        .summary-box {
            width: 100%;
            max-width: 400px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        .total-row {
            font-size: 1.5rem;
            font-weight: 700;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
        }

        .checkout-btn {
            background: #fff;
            color: #000;
            width: 100%;
            padding: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            cursor: pointer;
            margin-top: 30px;
            transition: 0.3s;
            display: block;
            text-align: center;
        }
        .checkout-btn:hover { background: #ccc; }


        /* Footer */
        footer { padding: 100px 5%; border-top: 1px solid var(--border-color); margin-top: 100px; }
        .footer-cta { font-family: 'Playfair Display'; font-size: 8vw; line-height: 0.9; color: #fff; text-transform: uppercase; }
        .footer-bottom { border-top: 1px solid var(--border-color); padding-top: 30px; display: flex; justify-content: space-between; color: #555; margin-top: 80px; }

        @media (max-width: 768px) {
            .cart-title { font-size: 15vw; }
            #cardHead { display: none; }
            .cart-product-item { flex-direction: column; align-items: flex-start; gap: 20px; position: relative; }
            .product-details-group { width: 100%; }
            .qty-column { width: 100%; justify-content: flex-start; }
            .total-column { position: absolute; top: 40px; right: 0; }
            .remove-btn { position: absolute; top: 0; right: 0; }
            .quantity-input { pointer-events: none; } /* On mobile maybe rely on +/- */
            .total-column .item-total-price { display: none; } /* Hide subtotal per item on mobile if tight? */
            
            /* Hide Cursor */
            .cursor, .cursor-follower { display: none !important; }
            .product-price-inlin{
                display: none;
            }
        }

    </style>
</head>
<body>
    
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <header class="main-header">
        <a href="index.html" class="header-logo"><img src="https://inkbyhand.com/wp-content/uploads/2025/08/Main-Logo-2-e1756815161444.png" alt="Logo"></a>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div style="font-size: 0.9rem;">CART (<span id="cart-count">0</span>)</div>
            <div class="burger" id="burger">
                <div class="line1"></div>
                <div class="line2"></div>
            </div>
        </div>
    </header>

    <nav class="nav-overlay" id="menu">
        <div class="nav-links">
            <a href="index.html" style="--i:0">HOME</a>
            <a href="product.html" style="--i:1">ARCHIVE</a>
            <a href="order.html" style="--i:1.5">ORDERS</a>
            <a href="about.html" style="--i:2">ABOUT</a>
            <a href="cart.html" style="--i:3">CART</a>
            <a href="contact.html" style="--i:4">CONTACT</a>
        </div>
    </nav>

    <div id="scroll-wrapper" data-scroll-container>
        <div class="page-spacer"></div>

        <section class="cart-container" data-scroll-section>
            
            <h1 class="cart-title" data-scroll data-scroll-speed="1">Your Selection</h1>

            <!-- EMPTY CART -->
            <div id="emptyCart">
                <!-- Injected via JS -->
            </div>

            <!-- FULL CART -->
            <div id="fullCartContent">
                
                <div id="cardHead">
                    <div style="flex:2;">Artwork</div>
                    <div style="flex:1; text-align:center;">Quantity</div>
                    <div style="flex:1; text-align:right;">Total</div>
                </div>

                <div id="cart-items">
                    <!-- Items Injected Here -->
                </div>

                <div class="cart-summary">
                    <div class="summary-box">
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span id="cartSubtotal">0 Rs</span>
                        </div>
                        <div class="summary-row" style="color:var(--text-muted); font-size: 0.9rem;">
                            <span>Shipping</span>
                            <span>Calculated at checkout</span>
                        </div>
                        <div class="summary-row total-row">
                            <span>Total</span>
                            <span id="cartFinalTotal">-</span>
                        </div>
                        
                        <button class="checkout-btn">PROCEED TO CHECKOUT</button>
                    </div>
                </div>

            </div>

        </section>

        <!-- FOOTER -->
        <footer data-scroll-section>
            <a href="index.html" class="footer-cta">LET'S BUILD<br>SOMETHING<br>ICONIC.</a>
            <div class="footer-bottom">
                <p>© 2026 INKBYHAND. ALL EDGES SHARP.</p>
                <div>
                   <a href="#" style="margin-right: 20px;">PRIVACY</a>
                   <a href="#">TERMS</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        // Init Locomotive + GSAP
        gsap.registerPlugin(ScrollTrigger);
        const locoScroll = new LocomotiveScroll({
            el: document.querySelector("[data-scroll-container]"),
            smooth: true, multiplier: 1, lerp: 0.05,
            smartphone: { smooth: false }, tablet: { smooth: false }
        });
        locoScroll.on("scroll", ScrollTrigger.update);
        ScrollTrigger.scrollerProxy("[data-scroll-container]", {
            scrollTop(value) { return arguments.length ? locoScroll.scrollTo(value, 0, 0) : locoScroll.scroll.instance.scroll.y; },
            getBoundingClientRect() { return { top: 0, left: 0, width: window.innerWidth, height: window.innerHeight }; },
            pinType: document.querySelector("[data-scroll-container]").style.transform ? "transform" : "fixed"
        });
        ScrollTrigger.refresh();

        // Cursor
        const cursor = document.querySelector(".cursor");
        const follower = document.querySelector(".cursor-follower");
        window.addEventListener("mousemove", e => {
            gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0 });
            gsap.to(follower, { x: e.clientX - 20, y: e.clientY - 20, duration: 0.3 });
        });

        // Menu
        const burger = document.getElementById('burger');
        const menu = document.getElementById('menu');
        burger.onclick = () => {
            menu.classList.toggle('active');
            const lines = burger.querySelectorAll('div');
            lines[0].style.transform = menu.classList.contains('active') ? 'translateY(4px) rotate(45deg)' : 'none';
            lines[1].style.transform = menu.classList.contains('active') ? 'translateY(-3px) rotate(-45deg)' : 'none';
        };

        // Expose to window for JS files
        window.locoScroll = locoScroll;
    </script>
    
    <script src="js/cart.js"></script>
</body>
</html>
